
# RITMO PÁDEL — Despliegue gratuito para portfolio

services:
  - type: web
    name: ritmo-padel-app
    runtime: node
    region: virginia
    plan: free
    branch: main

    autoDeployTrigger: off

    buildCommand: npm ci --include=dev && npm run build

    # En el plan gratuito no usamos preDeployCommand.
    # El seed prepara las tablas y las cuatro canchas.
    # En producción no crea usuarios demo.
    startCommand: npm run db:seed && npm start

    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: VITE_DATA_MODE
        value: live

      - key: CLUB_TIMEZONE
        value: America/Argentina/Buenos_Aires

      - key: SESSION_SECRET
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: ritmo-padel-db
          property: connectionString

      - key: PUBLIC_ORIGIN
        fromService:
          type: web
          name: ritmo-padel-app
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: ritmo-padel-db
    region: virginia
    plan: free
    postgresMajorVersion: "17"
    databaseName: ritmo_padel
    user: ritmo_app
