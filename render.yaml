
# RITMO PÁDEL — Producción
# React + Express + PostgreSQL

services:
  - type: web
    name: ritmo-padel-app
    runtime: node
    region: virginia
    plan: 0.5c-512mb
    branch: main

    # Publicación manual después de las pruebas
    autoDeployTrigger: off

    # Compilación completa del monorepositorio
    buildCommand: npm ci --include=dev && npm run build

    # Prepara la base ANTES de cada despliegue.
    # El seed es idempotente y no crea usuarios
    # de demostración en producción.
    preDeployCommand: npm run db:seed

    startCommand: npm start
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      - key: VITE_DATA_MODE
        value: live

      - key: CLUB_TIMEZONE
        value: America/Argentina/Buenos_Aires

      - key: SESSION_SECRET
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: ritmo-padel-db
          property: connectionString

      - key: PUBLIC_ORIGIN
        fromService:
          type: web
          name: ritmo-padel-app
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: ritmo-padel-db
    region: virginia
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
    databaseName: ritmo_padel
    user: ritmo_app

    ipAllowList: []
