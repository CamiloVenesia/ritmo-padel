services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ritmo
      POSTGRES_PASSWORD: ritmo_local_dev
      POSTGRES_DB: ritmo_padel
    ports:
      - '5432:5432'
    volumes:
      - ritmo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ritmo -d ritmo_padel']
      interval: 5s
      retries: 10
volumes:
  ritmo_pgdata:
